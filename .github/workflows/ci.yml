name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Fetch Go2 reference (pinned, checksummed; ADR 0002)
        run: python -m model.fetch_reference
      - name: Build Strider model from spec
        run: python -m model.build
      - name: Tests
        run: pytest -q tests/
